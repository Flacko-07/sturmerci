[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-hunter"
version = "2.0.0"
description = "AI-Native Autonomous Security Logic Hunter"
requires-python = ">=3.10"
dependencies = ["requests", "beautifulsoup4", "lxml", "ollama", "pyyaml"]

[project.scripts]
sentinel-hunter = "sentinel_hunter.cli:main"

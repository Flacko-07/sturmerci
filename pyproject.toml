[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sturmercyberintelligence"
version = "0.1.0"
description = "Sturmer Cyber Intelligence: local-first security assessment workbench"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "ada-url==4.0.0",
    "publicsuffixlist",
    "pydantic>=2.14",
    "ollama>=0.6",
    "psutil>=7.0",
    "idna>=3.4",
    "typer>=0.12",
    "rich>=13.0",
    "cvss>=3.6",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = ["pytest", "pywhatwgurl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
sentinel = ["storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
sentinel = "sentinel.cli:app"

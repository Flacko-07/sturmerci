name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and review tools
        run: python -m pip install -e '.[dev]' build pip-audit cyclonedx-bom ruff 'mcp>=1.30.0' 'opentelemetry-api>=1.45.2' 'setuptools>=84.1'
      - name: Lint
        run: ruff check --select E4,E7,E9,F src tests
      - name: Check Python formatting
        run: ruff format --check src tests
      - name: Compile source
        run: python -m compileall -q src
      - name: Run non-privileged tests
        run: >-
          python -m pytest -q
          --ignore=tests/egress
          --ignore-glob='*_integration.py'
          tests/adapters tests/runner tests/policy tests/findings tests/cli
          tests/l7 tests/llm tests/knowledge tests/triage tests/cvss
          tests/test_user_paths.py tests/test_packaging_resources.py
      - name: Audit Python dependencies
        run: python -m pip_audit --skip-editable
      - name: Generate environment SBOM
        run: cyclonedx-py environment --output-file sbom.json --output-format JSON
      - name: Build wheel
        run: python -m build --wheel
      - name: Check required wheel resources and metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel, = Path("dist").glob("*.whl")
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
              assert sum(name.startswith("sentinel/storage/migrations/") and name.endswith(".sql") for name in names) >= 21
              assert "sentinel/resources/wordlists/common.txt" not in names
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_name).decode()
              assert "Name: sturmercyberintelligence" in metadata
              assert "License-Expression: Apache-2.0" in metadata
              entry_points = archive.read(next(name for name in names if name.endswith(".dist-info/entry_points.txt"))).decode()
              assert "sentinel = sentinel.cli:app" in entry_points
          PY
      - name: Upload wheel and SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sturmer-review-artifacts
          path: |
            dist/*.whl
            sbom.json

  # -----------------------------------------------------------------------
  # Privileged egress suite — mirrors the documented maintainer command
  #   sudo -E .venv/bin/python -m pytest -q -rs tests/egress
  # from docs/TESTING.md. Needs root + iproute2 + nftables + dnsmasq +
  # iputils-ping + acl (for the setfacl-backed sandbox dir tests).
  # Runs in a privileged container so the runner can create network
  # namespaces, install nftables rules, toggle sysctls, and call
  # setpriv --reuid=nobody.
  # -----------------------------------------------------------------------
  egress:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      options: --privileged --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages (iproute2, nftables, dnsmasq, acl, ...)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            lsb-release \
            iproute2 \
            nftables \
            dnsmasq \
            procps \
            util-linux \
            iputils-ping \
            libc-bin \
            acl \
            bash \
            python3.12 python3.12-venv python3-pip
      - name: Bootstrap nobody/nogroup (defensive — base-files usually provides them)
        run: |
          if ! id nobody >/dev/null 2>&1; then
            useradd --system --no-create-home --uid 65534 --gid 65534 nobody || true
          fi
          if ! getent group nogroup >/dev/null 2>&1; then
            groupadd --system --gid 65534 nogroup || true
          fi
      - name: Create venv from system python3.12
        # actions/setup-python@v5's prebuilt CPython tarball is missing pip
        # when extracted inside an ubuntu:24.04 container (ENOENT on pip).
        # Use the system python3.12 we already apt-get installed and create
        # a venv to sidestep PEP 668 EXTERNALLY-MANAGED.
        run: |
          python3.12 -m venv /opt/venv
          /opt/venv/bin/python -m pip install --upgrade pip
      - name: Install project (dev extras)
        run: /opt/venv/bin/python -m pip install -e '.[dev]'
      - name: Egress environment probes (E-00a..E-00d)
        run: |
          # E-00 probes — fail fast if the container cannot do netns/nft.
          /opt/venv/bin/python -c "import shutil, sys; sys.exit(0 if all(shutil.which(t) for t in ('ip','nft','dnsmasq','setpriv','sysctl','setfacl')) else 1)"
          unshare -n true   # smoke-test that netns creation works as root
          nft list tables   # smoke-test that nft is usable
      - name: Run egress suite (privileged)
        run: /opt/venv/bin/python -m pytest -q -rs tests/egress
      - name: Show egress results
        if: always()
        run: cat test-results.xml 2>/dev/null || true

  # -----------------------------------------------------------------------
  # Privileged adapter integration suite — mirrors the documented command
  #   sudo -E .venv/bin/python -m pytest -q -rs tests/adapters/test_*_integration.py
  # from docs/TESTING.md. The three test files synthesize their own fake
  # nmap/httpx/subfinder shell scripts in /tmp (no real scanner binaries,
  # no licenses, no external targets), so they need the same privileges
  # as the egress suite (root + iproute2 + nftables + dnsmasq + setpriv).
  # -----------------------------------------------------------------------
  adapter-integration:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      options: --privileged --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages (iproute2, nftables, dnsmasq, acl, ...)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            lsb-release \
            iproute2 \
            nftables \
            dnsmasq \
            procps \
            util-linux \
            iputils-ping \
            libc-bin \
            acl \
            bash \
            python3.12 python3.12-venv python3-pip
      - name: Bootstrap nobody/nogroup
        run: |
          if ! id nobody >/dev/null 2>&1; then
            useradd --system --no-create-home --uid 65534 --gid 65534 nobody || true
          fi
          if ! getent group nogroup >/dev/null 2>&1; then
            groupadd --system --gid 65534 nogroup || true
          fi
      - name: Create venv from system python3.12
        # actions/setup-python@v5's prebuilt CPython tarball is missing pip
        # when extracted inside an ubuntu:24.04 container (ENOENT on pip).
        # Use the system python3.12 we already apt-get installed and create
        # a venv to sidestep PEP 668 EXTERNALLY-MANAGED.
        run: |
          python3.12 -m venv /opt/venv
          /opt/venv/bin/python -m pip install --upgrade pip
      - name: Install project (dev extras)
        run: /opt/venv/bin/python -m pip install -e '.[dev]'
      - name: Run adapter integration tests (privileged)
        run: /opt/venv/bin/python -m pytest -q -rs tests/adapters/test_httpx_integration.py tests/adapters/test_nmap_integration.py tests/adapters/test_subfinder_integration.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}

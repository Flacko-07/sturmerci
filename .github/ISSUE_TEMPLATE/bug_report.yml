name: Bug report
description: Report a non-sensitive defect using a local or synthetic environment
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, real target details, engagement evidence, or vulnerability disclosure information.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Local or synthetic reproduction
    validations:
      required: true
